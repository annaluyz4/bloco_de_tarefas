<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLOCO DE TAREFAS</title>

    <link rel="stylesheet" href="bloco.css">
</head>

<body>

    <h1>Minhas tarefas ⋆*:.ೃ࿔⋆🪼</h1>

    <div class="adicionar-tarefa">

        <input 
            type="text" 
            id="tarefa" 
            placeholder="Digite uma tarefa.."
        >

        <button id="adicionar">
            Adicionar･⁠｡ﾟ💿･⁠｡ﾟ
        </button>

    </div>


    <!-- criar os blocos -->
    <div id="lista-tarefas"></div>


    <div class="barra-tarefas">

        <button class="botao-iniciar">
            Iniciar
        </button>

        <div class="atalhos-barra">

            <button class="icone-atalho" title="Pasta">
                📁
            </button>

            <button class="icone-atalho" title="Música">
                🎵
            </button>

        </div>

        <span class="assinatura-aero">
            Desenvolvido por Anna Luyza 🩵✨
        </span>

    </div>


    <!-- JavaScript -->
    <script src="blocodenotas.js"></script>

</body>
</html>
